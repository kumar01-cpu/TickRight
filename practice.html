<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TickRight.com – Redirecting…</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="practice">
    <p class="message" id="message">Taking you to your questions… <a href="index.html">Home</a></p>
  </main>

  <script src="js/utils.js"></script>
  <script>
    // Old links look like practice.html?type=pyqs&group=UPSSSC-PET&item=2026-25-Oct-Shift-1
    // The questions now live on their own pages, so we forward the visitor there.
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type");
      const groupId = params.get("group");
      let itemId = params.get("item");
      try {
        const manifest = await loadManifest();
        const group = (manifest[type] || []).find(function (g) { return g.id === groupId; });
        const items = group ? (type === "pyqs" ? group.papers : group.parts) : [];
        if (items && items.length) {
          if (!items.some(function (i) { return i.id === itemId; })) itemId = items[0].id;
          window.location.replace([type, groupId, itemId].map(encodeURIComponent).join("/") + "/");
          return;
        }
      } catch (error) {
        console.error(error);
      }
      window.location.replace("index.html"); // anything unknown goes to the homepage
    })();
  </script>
</body>
</html>
