# deploy.yml – runs automatically every time you upload (push) to GitHub.
# Job 1 (build):  builds manifest.json AND the ready-made HTML pages, packages the site.
# Job 2 (deploy): publishes the package to GitHub Pages.
# They are separate jobs on purpose, so GitHub has time to register the package.

name: Build site and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you start it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build manifest and pages
        run: python scripts/build-site.py

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4