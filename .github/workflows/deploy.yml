# deploy.yml – runs automatically every time you upload (push) to GitHub.
# 1) regenerates manifest.json from your data folders
# 2) publishes the website to GitHub Pages

name: Build manifest and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you start it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate manifest.json
        run: python scripts/generate-manifest.py

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4